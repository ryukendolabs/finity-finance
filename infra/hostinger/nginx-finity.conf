# Finity: the web app on 127.0.0.1:3100 and the public read-only API on 127.0.0.1:8787 (/v1/). certbot adds the
# HTTPS server block and the redirect. The client address is passed in X-Real-IP (the app trusts it with
# TRUST_PROXY_HEADERS=1); client-sent forwarding headers are overwritten.
server {
  listen 80;
  listen [::]:80;
  server_name @DOMAIN@;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /v1/ {
    proxy_pass http://127.0.0.1:8787;
  }

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_read_timeout 60s;
  }
}
