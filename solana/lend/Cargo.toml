[workspace]

[package]
name = "finity-lend"
version = "0.1.0"
edition = "2021"
description = "Finity Lend: borrow against collateral and repay, a minimal mainnet program"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Adds `withdraw` and `liquidate` (left out of the mainnet build).
full = []
# The shutdown program: vault_admin and close only (see src/lib.rs).
teardown = []

[dependencies]
pinocchio = { version = "0.12.0", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-address = { version = "2.9.0", features = ["curve25519"] }
litesvm-token = { version = "0.10.0", features = ["token-2022"] }
solana-account = "3"
solana-instruction = "3.5.1"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-clock = "3.2.1"
solana-keypair = "3.1.2"
solana-message = "3.1.0"
solana-transaction = "3.1.0"
solana-signer = "3.0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
overflow-checks = false
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
