[package]
name = "finity"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "finity"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", default-features = false, features = ["solana-v3", "token", "token_2022", "token_2022_extensions", "associated_token"] }
uint = { version = "0.10.2", default-features = false }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = "3.1.0"
solana-instructions-sysvar = "3.0.1"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
litesvm-token = "0.10.0"
finity-risk-core = { path = "../../reference/risk-core" }
proptest = "1"
alloy-primitives = { version = "1.7.3", default-features = false }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
